name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    timeout-minutes: 30

    # `secrets` is not among the contexts available to a step-level `if`, so the token is hoisted
    # into the job environment where the Codecov steps can test it.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      # No `--ignore=docs` here, unlike the template: this project's docs are hand-written and
      # doctested, so skipping them in CI would let a documented example drift from real output.
      - name: Run tests
        run: >
          uv run pytest -v
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=junit.xml

      # Skip Codecov when there is no token to use. Two cases: Dependabot runs do not get
      # repository secrets (a deliberate GitHub security policy), and a freshly created repository
      # has not had its token configured yet. In both, uploading is impossible rather than broken,
      # so failing the run would be reporting the wrong problem. `fail_ci_if_error` stays on, so a
      # genuine upload failure with a token present is still loud.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != '' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' && github.actor != 'dependabot[bot]' }}
        uses: codecov/test-results-action@v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
